name: Synchronize app catalog

on:
  schedule:
    - cron: '17 * * * *' # Every hour at minute 17 (UTC).
  workflow_dispatch: # Manual Run workflow button.
  repository_dispatch:
    types: [update-addons] # Sent by the individual app repositories.
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/update.yml'
      - '.templates/**'

permissions:
  contents: read

concurrency:
  group: synchronize-app-catalog
  cancel-in-progress: false # Serialize writes; do not cancel a running synchronization.

jobs:
  synchronize:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # GITHUB_TOKEN is sufficient for commits to this repository.
    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: false # The helper initializes and verifies each source itself.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install the catalog dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Discover apps and update pinned submodules
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/update_repo.py

      - name: Commit and push only when something changed
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "The app catalog is already up to date."
            exit 0
          fi
          git commit -m "chore: synchronize app submodules and catalog"
          git push origin "HEAD:${TARGET_BRANCH}"
